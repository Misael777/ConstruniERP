[package]
name = "tauri-plugin-push"
version = "0.1.0"
edition = "2021"
license = ""
links = "tauri-plugin-push"
description = "Ticket #113: notificaciones push (Firebase Cloud Messaging) en la app Android de Construni ERP, agrupadas por categoría."

[lib]
name = "tauri_plugin_push"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2.0.0-rc.17", default-features = false, features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
