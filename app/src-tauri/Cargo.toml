[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.71"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc.13", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
log = "0.4"
tauri = { version = "2.0.0-rc.17", default-features = false, features = ["rustls-tls", "wry", "devtools"] }
tauri-plugin-log = "2.0.0-rc"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-share-target = { path = "plugins/tauri-plugin-share-target" }
# Módulo de Tickets/Releases (ver Documentacion/MecanismoCICD.md): tauri-plugin-os para que el
# frontend sepa si corre en Windows o Android (BotonActualizar.svelte) — funciona en ambos.
tauri-plugin-os = "2"
# En Android, BotonActualizar.svelte usa openPath() de este plugin para invocar el instalador nativo
# de APK sobre el archivo ya descargado de Drive — plugin oficial de Tauri, soporta Android/iOS
# (a diferencia de tauri-plugin-updater, que es solo de escritorio).
tauri-plugin-opener = "2"

# El plugin de auto-update de Tauri es SOLO de escritorio (no compila para Android/iOS) — coincide
# con el diseño ya decidido: Windows se actualiza solo vía este plugin, Android descarga el APK
# desde Drive y el usuario lo instala a mano (ver BotonActualizar.svelte).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
